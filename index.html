<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Défense mentale</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <div>
        <p id="levelName" class="level"></p>
        <div class="meters">
          <div class="meter life-meter"><span id="lifeLabel"></span><span id="lifeBar" class="life"><i></i></span><strong id="lifeValue"></strong></div>
          <div class="meter"><span id="streakLabel"></span><span id="streakPips" class="pips"></span></div>
          <div class="meter"><span id="errorLabel"></span><span id="errorPips" class="pips err"></span></div>
          <div class="meter"><span id="speedLabel"></span><strong id="speedValue"></strong></div>
        </div>
      </div>
      <button id="langBtn" class="ghost" type="button"></button>
    </header>

    <section class="stage">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="overlay" class="overlay" role="dialog" aria-live="polite">
        <h1 id="overlayTitle"></h1>
        <p id="overlayText"></p>
        <button id="overlayBtn" class="primary" type="button"></button>
      </div>
    </section>

    <section class="quiz">
      <p id="prompt" class="prompt" aria-live="polite"></p>
      <div id="options" class="options"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/math.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/questions/numeric.js"></script>
  <script src="js/questions/complex.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
